 $('levelLabel').textContent=`${{thinking:'思维乐园',addition:'加法小屋',subtraction:'减法小屋'}[category]} / ${l.title}`;$('progress').textContent=`题卡 ${String(index+1).padStart(2,'0')} / ${String(filtered().length).padStart(2,'0')}`;
 $('tracks').innerHTML=`<path d="M105 1170 H935 V135"/>`+COLORS.map((_,i)=>`<path d="M${home(i).x} 1255 V1170 M935 ${slot(i).y} H845"/>`).join('');
 $('paper').innerHTML=paperSvg(l);
 $('slots').innerHTML=answers.map(answerSvg).join('');
 $('homes').innerHTML=COLORS.map((c,i)=>`<circle cx="${home(i).x}" cy="1255" r="36" fill="#242f66" stroke="#5d699b" stroke-width="2"/><text x="${home(i).x}" y="1310" text-anchor="middle" font-size="14" fill="#b8c2e0">${NAMES[i]}</text>`).join('');
 $('tokens').innerHTML=COLORS.map((c,i)=>`<g class="token ${i===2?'yellow':''}" id="token${i}" data-token="${i}" role="button" tabindex="0" aria-label="${NAMES[i]}色圆钮，尚未配对" transform="translate(${home(i).x} 1255)"><circle class="selection" r="43" fill="none" stroke="#fff5b7" stroke-width="4" stroke-dasharray="6 4"/><circle r="35" fill="${c}" filter="url(#shadow)"/><circle r="29" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/><ellipse cy="-17" rx="15" ry="6" fill="#fff" opacity=".13"/><text class="token-label" text-anchor="middle" y="5">${NAMES[i]}</text><text class="result-mark" text-anchor="middle" y="7" fill="white" style="display:none"></text></g>`).join('');
 document.querySelectorAll('[data-q]').forEach(e=>{e.onclick=()=>select(+e.dataset.q);e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();select(+e.dataset.q)}}});
 document.querySelectorAll('[data-answer],[data-slot]').forEach(e=>{const f=()=>placeSelected(+(e.dataset.answer??e.dataset.slot));e.onclick=f;e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();f()}}});
 document.querySelectorAll('[data-token]').forEach(e=>{e.onpointerdown=startDrag;e.onkeydown=k=>{if(k.key==='Enter'||k.key===' '){k.preventDefault();select(+e.dataset.token)}else if(k.key==='Escape'){selected=null;updateSelection()}}});
 $('read').onclick=readQuestion;$('read').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();readQuestion()}};$('previous').disabled=index===0;$('next').disabled=index===filtered().length-1;
 message('点一个彩色圆钮，再点右边的答案；也可以沿白线拖动。');update();
}
function message(s){$('message').textContent=s;}
function update(){const n=assignments.filter(v=>v!==null).length;$('placedCount').textContent=`${n}/6`;$('completedCount').textContent=`已完成 ${completed.size} 张题卡`;$('stars').textContent='★'.repeat(Math.min(6,completed.size));}
function updateSelection(){document.querySelectorAll('[data-q]').forEach(e=>e.classList.toggle('selected',+e.dataset.q===selected));document.querySelectorAll('[data-token]').forEach(e=>e.classList.toggle('selected',+e.dataset.token===selected));}
function clearMarks(){checked=false;document.querySelectorAll('.result-mark').forEach(e=>e.style.display='none');document.querySelectorAll('.token-label').forEach(e=>e.style.display='');}
function select(i){selected=i;updateSelection();message(`选中了${NAMES[i]}色题目，找一找它的答案吧。`);}
function move(i,p){positions[i]=p;$('token'+i).setAttribute('transform',`translate(${p.x} ${p.y})`);}
// All movement uses this tree-shaped rail network: six home branches, one base,
// one vertical trunk and six answer branches. No token can cut across the paper.
function attachment(p){if(Math.abs(p.y-base)<.1)return {p,s:p.x-105};if(p.y>base)return {p:{x:p.x,y:base},s:p.x-105};return {p:{x:trunk,y:p.y},s:830+base-p.y};}
function onSpine(s){return s<=830?{x:105+s,y:base}:{x:trunk,y:base-(s-830)};}
function route(a,b){if(Math.abs(a.x-b.x)<.1&&a.y>=base&&b.y>=base)return[a,b];if(Math.abs(a.y-b.y)<.1&&a.y<base&&a.x>=845&&b.x>=845)return[a,b];const aa=attachment(a),bb=attachment(b),pts=[a,aa.p];if(Math.min(aa.s,bb.s)<830&&Math.max(aa.s,bb.s)>830)pts.push(onSpine(830));pts.push(bb.p,b);return pts.filter((p,i)=>i===0||Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y)>.01);}
function along(points,d){for(let j=1;j<points.length;j++){const a=points[j-1],b=points[j],len=Math.hypot(b.x-a.x,b.y-a.y);if(len<.001)continue;if(d<=len)return{x:a.x+(b.x-a.x)*d/len,y:a.y+(b.y-a.y)*d/len};d-=len}return points[points.length-1];}
function routeLength(r){return r.slice(1).reduce((n,p,i)=>n+Math.hypot(p.x-r[i].x,p.y-r[i].y),0);}
// Sweep each rail segment against all other discs, including fast drags and
// reduced-motion jumps. Stop before contact instead of passing through a disc.
const TOKEN_CLEARANCE=74;
function safeAdvance(i,points,budget){
 let p={...points[0]},left=budget;
 for(let k=1;k<points.length&&left>.0001;k++){
  const end=points[k],length=Math.hypot(end.x-p.x,end.y-p.y);if(length<.0001)continue;
  const vx=(end.x-p.x)/length,vy=(end.y-p.y)/length,step=Math.min(left,length);let allowed=step,blocked=false;
  for(let j=0;j<positions.length;j++){
   if(j===i)continue;const dx=p.x-positions[j].x,dy=p.y-positions[j].y,projection=dx*vx+dy*vy,c=dx*dx+dy*dy-TOKEN_CLEARANCE*TOKEN_CLEARANCE;
   if(projection>=0)continue;const discriminant=projection*projection-c;if(discriminant<0)continue;
   const entry=Math.max(0,-projection-Math.sqrt(discriminant));
   if(entry<=allowed){allowed=Math.max(0,entry-.01);blocked=true;}
  }
  p={x:p.x+vx*allowed,y:p.y+vy*allowed};if(blocked)return {point:p,blocked:true};left-=step;
 }
 return {point:p,blocked:false};
}
function animate(i,target,onArrival){
 cancelAnimationFrame(animations[i]);const r=route(positions[i],target),len=routeLength(r),start=performance.now(),gen=generation,duration=matchMedia('(prefers-reduced-motion: reduce)').matches?1:Math.max(180,len*.8);let travelled=0;
 function tick(t){
  if(gen!==generation)return;const f=Math.min(1,(t-start)/duration),distance=len*(f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2),step=safeAdvance(i,route(positions[i],target),Math.max(0,distance-travelled));
  move(i,step.point);travelled=distance;
  if(step.blocked){delete animations[i];destinations[i]=null;parkOnTrack(i);message('前面有圆钮挡住了，先把它移开，再继续吧。');return;}
  if(f<1)animations[i]=requestAnimationFrame(tick);else{delete animations[i];destinations[i]=null;if(onArrival)onArrival();}
 }
 animations[i]=requestAnimationFrame(tick);
}
function place(i,s){
 const occupied=assignments.some((v,j)=>j!==i&&v===s)||destinations.some((v,j)=>j!==i&&v===s);
 if(occupied){message('这个位置已有圆钮，请先把它移开，再放进来。');return;}
 clearMarks();assignments[i]=null;destinations[i]=s;selected=null;updateSelection();update();
 animate(i,slot(s),()=>{assignments[i]=s;$('token'+i).setAttribute('aria-label',`${NAMES[i]}色圆钮，已放到答案 ${answers[s]}`);update();tone(440+i*55,.07);message(assignments.every(v=>v!==null)?'六个圆钮都到家啦！点“检查答案”看看吧。':'放好啦！继续帮其他颜色找到答案。');});
}
function placeSelected(s){if(selected===null){message('先点一个彩色圆钮，再来选答案吧。');return}place(selected,s);}
function point(e){const m=$('board').getScreenCTM().inverse();return new DOMPoint(e.clientX,e.clientY).matrixTransform(m);}
function startDrag(e){if(drag&&drag.pointer!==e.pointerId)return;e.preventDefault();const i=+e.currentTarget.dataset.token;cancelAnimationFrame(animations[i]);delete animations[i];destinations[i]=null;if(assignments[i]!==null&&Math.hypot(positions[i].x-slot(assignments[i]).x,positions[i].y-slot(assignments[i]).y)>.1){clearMarks();assignments[i]=null;update();}select(i);drag={i,start:point(e),last:point(e),moved:false,pointer:e.pointerId};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.onpointermove=dragMove;e.currentTarget.onpointerup=endDrag;e.currentTarget.onpointercancel=cancelDrag;e.currentTarget.onlostpointercapture=cancelDrag;}
function nearest(p){let candidates=[{x:Math.max(105,Math.min(trunk,p.x)),y:base},{x:trunk,y:Math.max(135,Math.min(base,p.y))}];for(let i=0;i<6;i++){candidates.push({x:home(i).x,y:Math.max(base,Math.min(1255,p.y))},{x:Math.max(845,Math.min(trunk,p.x)),y:slot(i).y});}return candidates.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];}
function dragMove(e){if(!drag||e.pointerId!==drag.pointer)return;let p=point(e);if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>8)drag.moved=true;if(drag.moved){clearMarks();assignments[drag.i]=null;const target=nearest(p),r=route(positions[drag.i],target),d=Math.hypot(p.x-drag.last.x,p.y-drag.last.y);const step=safeAdvance(drag.i,r,Math.min(routeLength(r),d*1.6+6));move(drag.i,step.point);if(step.blocked)message('前面有圆钮挡住了，先把它移开，再继续吧。');update()}drag.last=p;}
function parkOnTrack(i){assignments[i]=null;destinations[i]=null;$('token'+i).setAttribute('aria-label',`${NAMES[i]}色圆钮，停在轨道上，尚未配对`);message('圆钮停在这里啦。可以接着拖动，也可以点右边的答案。');update();}
function endDrag(){if(!drag)return;const {i,moved}=drag;drag=null;if(!moved)return;const near=COLORS.findIndex((_,j)=>Math.hypot(positions[i].x-slot(j).x,positions[i].y-slot(j).y)<43);if(near>=0)place(i,near);else parkOnTrack(i);}
function cancelDrag(){if(!drag)return;const {i,moved}=drag;drag=null;if(moved||assignments[i]===null)parkOnTrack(i);}
function tone(freq,duration){if(!sound)return;try{const ctx=audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)());ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.start();o.stop(ctx.currentTime+duration);}catch{}}
let audioCtx;
function check(){if(assignments.some(v=>v===null)){message('还有圆钮在等你，把六个颜色都送到答案旁边吧。');return}let correct=0;assignments.forEach((s,i)=>{const ok=answers[s]===level().questions[i].answer;if(ok)correct++;const el=$('token'+i);el.querySelector('.token-label').style.display='none';el.querySelector('.result-mark').textContent=ok?'✓':'· ·';el.querySelector('.result-mark').style.display='';});checked=true;if(correct===6){completed.add(level().id);try{localStorage.setItem('rainbow-completed',JSON.stringify([...completed]));}catch{}update();message('六个都找对了！你观察得真仔细。准备好就去玩下一张吧！');celebrate();[523,659,784].forEach((n,i)=>setTimeout(()=>tone(n,.18),i*130));}else{message(`已经找对 ${correct} 个啦！有小点点的圆钮，再看一看它的题目吧。`);tone(330,.15);}}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;$('confetti').innerHTML=Array.from({length:45},(_,i)=>`<i class="confetti" style="left:${Math.random()*100}%;background:${COLORS[i%6]};animation-delay:${Math.random()*.6}s"></i>`).join('');setTimeout(()=>$('confetti').replaceChildren(),3300);}
function readQuestion(){if(!('speechSynthesis'in window)){message('这个浏览器暂时不能读题，请和大人一起读上面的说明。');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`${level().title}。${level().desc}。先点一个彩色圆钮，再点对应的答案。`);u.lang='zh-CN';u.rate=.8;u.onerror=()=>message('读题暂时不可用，可以请大人读一下上方说明。');speechSynthesis.speak(u);}
function modal(title,content){$('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('modal').showModal();}
function library(){modal('今天想玩哪一张？',`<div class="level-grid">${filtered().map((l,i)=>`<button class="level-choice ${i===index?'current':''}" data-level="${i}">${completed.has(l.id)?'★ ':''}${l.title}<small>${i+1} / ${filtered().length} · 6个小练习${completed.has(l.id)?' · 已完成':''}</small></button>`).join('')}</div><p class="help-foot">切换上方分类，还可以玩加法和减法。换题后，圆钮会回到起点。</p>`);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{index=+b.dataset.level;$('modal').close();render()});}
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;index=0;render()});
$('previous').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<filtered().length-1){index++;render()}};$('reset').onclick=render;$('check').onclick=check;$('library').onclick=library;$('closeModal').onclick=()=>$('modal').close();$('modal').onclick=e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('modal').close()}};
$('help').onclick=()=>modal('一起玩彩虹思维板',`<div class="help-step"><b>1</b><span>先看顶部说明，再看带有颜色标记的六道题。</span></div><div class="help-step"><b>2</b><span>点底部对应颜色的圆钮，再点右侧答案。圆钮会沿白色轨道滑过去。也可以用手指沿轨道拖动，松手后圆钮会停在当前位置，可以分几次慢慢移动。圆钮不能互相穿过，前方被挡住时，先移动挡路的圆钮。</span></div><div class="help-step"><b>3</b><span>六个圆钮都放好后，点“检查答案”。小勾表示配对成功，小点点表示可以再试一次。</span></div><p class="help-foot">给陪伴的大人：共有16张题卡、96个小练习。建议从数数和形状开始，再尝试规律与十以内加减法。加减法配有圆点提示，可以边指边数。没有计时，也不扣分。完成记录仅保存在当前浏览器。</p>`);
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫':'♩';$('sound').setAttribute('aria-label',sound?'关闭提示音':'开启提示音');$('sound').setAttribute('aria-pressed',sound);if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel();};render();
</script></body></html>
